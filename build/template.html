<title>12월 북해도 가족여행</title>
<meta name="description" content="북해도(홋카이도) 3박4일 가족여행 계획과 3D 여행지도">
<style>
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --surface2:#F4F6F8; --ink:#141C24; --muted:#4F5D6B; --line:#D5DCE3;
  --acc:#1F6FB2; --acc-ink:#FFFFFF; --acc-soft:#E2EDF8;
  --good:#1B7349; --good-soft:#E0F2E8; --warn:#9A5700; --warn-soft:#FBEFD9; --bad:#AC3528; --bad-soft:#F8E2DE;
  --mapbg:#0E1620; --hh:58px; --nh:64px;
  color-scheme:light;
}
:root[data-c="tw"]{ --acc:#B3432A; --acc-soft:#F7E6E0; }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0D1217; --surface:#161D25; --surface2:#1C252F; --ink:#E8EDF2; --muted:#A3AFBC; --line:#2B3643;
    --acc:#62A7E6; --acc-ink:#0D1217; --acc-soft:#1B2E42; --good:#62C997; --good-soft:#15312A; --warn:#E6AA52; --warn-soft:#33270F; --bad:#F08476; --bad-soft:#3A1D1A; color-scheme:dark; }
  :root:not([data-theme="light"])[data-c="tw"]{ --acc:#EA876F; --acc-soft:#3A2019; }
}
:root[data-theme="dark"]{ --bg:#0D1217; --surface:#161D25; --surface2:#1C252F; --ink:#E8EDF2; --muted:#A3AFBC; --line:#2B3643;
  --acc:#62A7E6; --acc-ink:#0D1217; --acc-soft:#1B2E42; --good:#62C997; --good-soft:#15312A; --warn:#E6AA52; --warn-soft:#33270F; --bad:#F08476; --bad-soft:#3A1D1A; color-scheme:dark; }
:root[data-theme="dark"][data-c="tw"]{ --acc:#EA876F; --acc-soft:#3A2019; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16.5px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35}
p{margin:0}
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--hh);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-inline:16px}
.hdr h1{font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:14px;border-radius:999px;padding:5px 12px}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 13px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav button{border:0;background:transparent;height:var(--nh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--muted)}
.bnav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav button[aria-current="page"]{color:var(--acc)}
/* views */
.view{max-width:640px;margin:0 auto;padding:18px 16px calc(var(--nh) + 36px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>h2{font-size:20px;letter-spacing:-.01em}
.lead{color:var(--muted);font-size:15.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.note{font-size:14px;color:var(--muted);line-height:1.6}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.p-best{background:var(--good-soft);color:var(--good)} .p-ok{background:var(--acc-soft);color:var(--acc)} .p-mid{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 14px;font-size:15.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.wide{width:100%}
.hero .btn{background:#FFFFFF;color:#15212C;border-color:#FFFFFF}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* hero */
.hero{background:var(--acc);color:var(--acc-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero h2{font-size:23px}
.hero p{opacity:.92;font-size:15.5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.kpi small{font-size:13px;opacity:.85}
.kpi b{font-size:19px;font-variant-numeric:tabular-nums;line-height:1.35}
:root[data-theme="dark"] .kpi,:root:not([data-theme="light"]) .kpi{background:rgba(0,0,0,.12)}
/* compare */
.cmp{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cmp .hd,.cmp .row>div{display:grid;grid-template-columns:1fr 1fr}
.cmp .hd{background:var(--surface2);font-weight:800;font-size:15px}
.cmp .hd span,.cmp .v span{padding:9px 14px}
.cmp .hd span.on,.cmp .v span.on{background:var(--acc-soft)}
.cmp .row{border-top:1px solid var(--line)}
.cmp .lab{font-size:13.5px;color:var(--muted);padding:8px 14px 0;display:block}
.cmp .v span{font-size:15.5px;font-weight:600;padding-top:2px}
/* date cards */
.dc{text-align:left;cursor:pointer}
.dc.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.dch{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:17px}
.dcs{display:flex;gap:22px;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.dcs small{display:block;font-weight:500;color:var(--muted);font-size:13px}
ul.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
/* day chips */
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.3;font-weight:800;font-size:15px}
.days button small{font-weight:500;font-size:12.5px;color:var(--muted)}
.days button i{width:100%;height:4px;border-radius:2px;margin-top:6px}
.days button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset}
.dayhead{border-left:6px solid;display:flex;flex-direction:column;gap:10px}
.dayhead h2{font-size:19px}
/* stops */
.stops{display:flex;flex-direction:column;gap:0}
.st{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.st>summary{list-style:none;display:grid;grid-template-columns:58px 1fr 20px;gap:10px;align-items:center;padding:13px 14px;cursor:pointer}
.st>summary::-webkit-details-marker{display:none}
.st .t{font-variant-numeric:tabular-nums;font-weight:800;font-size:16px}
.st .n{font-weight:700;font-size:16.5px;line-height:1.4}
.st .n small{display:block;font-weight:500;color:var(--muted);font-size:13.5px}
.st .chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .15s}
.st[open] .chev{transform:rotate(180deg)}
.st[open]{border-color:var(--acc)}
.stb{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.blk b{display:block;font-size:13.5px;color:var(--muted);font-weight:700;margin-bottom:2px}
.blk.cau{background:var(--warn-soft);border-radius:10px;padding:10px 12px}
.blk.cau b{color:var(--warn)}
.blk.par{background:var(--good-soft);border-radius:10px;padding:10px 12px}
.blk.par b{color:var(--good)}
.story{font-size:15px;background:var(--surface2);border-radius:10px;padding:10px 12px}
.story b{color:var(--acc)}
.leg{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);padding:6px 0 6px 30px;position:relative}
.leg:before{content:"";position:absolute;left:36px;top:0;bottom:0;border-left:2px dashed var(--line)}
.leg span{background:var(--bg);padding:2px 8px 2px 18px;position:relative}
/* info */
.sub{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sub button{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 2px;font-weight:700;font-size:15px}
.sub button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kv{display:grid;grid-template-columns:4.2em 1fr;gap:6px 12px;font-size:15.5px;margin:0}
.kv dt{color:var(--muted);font-size:14px;padding-top:1px} .kv dd{margin:0}
.big{font-size:clamp(22px,6.5vw,30px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.3}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat small{color:var(--muted);font-size:13.5px}
.bars{display:flex;flex-direction:column;gap:14px}
.bar .top{display:flex;justify-content:space-between;gap:10px;font-size:15.5px}
.bar .top b{font-variant-numeric:tabular-nums}
.bar .tr{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden;margin:5px 0 3px}
.bar .tr i{display:block;height:100%;background:var(--acc);border-radius:5px}
.check{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:16px}
.check:last-child{border-bottom:0}
.check input{width:22px;height:22px;margin-top:3px;accent-color:var(--acc);flex:none}
/* phrases */
.pc{display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px}
.pc .k{font-size:14.5px;color:var(--muted);font-weight:600}
.pc .l{font-size:21px;font-weight:800;white-space:pre-line;line-height:1.45}
.pc .r{font-size:14px;color:var(--acc)}
.ph{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-bottom:1px solid var(--line)}
.ph:last-child{border-bottom:0}
.ph .k{font-size:14.5px;color:var(--muted);font-weight:600}
.ph .l{font-size:19px;font-weight:700}
.ph .r{font-size:14px;color:var(--acc)}
.ph .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ph button{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:6px 12px;font-size:14px;flex:none}
.show{position:fixed;inset:0;z-index:100;background:#FFFFFF;color:#0A0F14;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;gap:22px;text-align:center}
.show .l{font-size:clamp(30px,9vw,54px);font-weight:800;line-height:1.35;white-space:pre-line}
.show .k{font-size:17px;color:#4A5561}
.show button{border:1px solid #C9D1D9;background:#F1F4F7;border-radius:12px;padding:12px 26px;font-size:17px;color:#0A0F14}
/* map view */
#mapWrap{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + var(--hh));bottom:calc(var(--nh) + env(safe-area-inset-bottom,0px));background:var(--mapbg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;z-index:10}
#mapWrap canvas{display:block;width:100%;height:100%}
.touring #mapWrap{top:0;bottom:0;z-index:60}
.touring .hdr,.touring .bnav{visibility:hidden}
.mo{position:absolute;z-index:3}
.mtop{top:8px;left:8px;right:8px;display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid rgba(255,255,255,.2);background:rgba(12,18,26,.78);color:#F0F4F8;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:inline-flex;align-items:center;gap:6px;min-height:36px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:#F4F7FA;color:#101820;border-color:#F4F7FA}
.chips.sm .chip{font-size:13px;font-weight:600;min-height:32px;padding:4px 11px}
.mside{right:8px;top:94px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.mbot{left:8px;right:8px;bottom:22px;background:rgba(12,18,26,.82);color:#F0F4F8;border-radius:14px;padding:8px 12px 7px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:2px}
.mbot .row{display:flex;align-items:center;gap:10px}
.mbot .clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:17px;min-width:54px}
.mbot .sun{font-size:13px;color:#C3CED9;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mbot input[type=range]{flex:1;accent-color:#FFB547;height:30px}
.hint{left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(12,18,26,.8);color:#F0F4F8;font-size:14px;padding:10px 14px;border-radius:12px;text-align:center;pointer-events:none;max-width:80%}
.attr{right:6px;bottom:3px;font-size:9.5px;color:#C9D3DC;background:rgba(0,0,0,.35);padding:1px 5px;border-radius:4px;max-width:calc(100% - 12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.labels{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.pin{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:auto;will-change:transform}
.pin b{min-width:26px;height:26px;border-radius:13px;border:2px solid #fff;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin span{margin-top:2px;background:rgba(255,255,255,.94);color:#101820;font-size:13px;font-weight:700;padding:1px 7px;border-radius:7px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pin.dim{opacity:.5}.pin.dim span,.pin.nolab span{display:none}
.pin.small b{min-width:12px;height:12px;border-width:1.5px;font-size:0;padding:0}
.alabel{position:absolute;left:0;top:0;transform:translate(-50%,-50%);color:#fff;font-weight:800;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.85);white-space:nowrap}
.me{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;background:#FFD24A;border:3px solid #fff;box-shadow:0 0 0 5px rgba(255,210,74,.35),0 2px 6px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:16px}
.loading{inset:0;display:flex;align-items:center;justify-content:center;color:#DCE4EC;font-size:15px;background:rgba(10,15,22,.6);z-index:6;text-align:center;padding:16px}
.maperr{left:8px;right:8px;bottom:90px;background:#3A1D1A;color:#FFD9D3;border-radius:10px;padding:10px;font-size:14px;z-index:7}
.pcard{left:8px;right:8px;bottom:96px;z-index:7;background:var(--surface);color:var(--ink);border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:8px}
.pcard .x{position:absolute;right:8px;top:6px;border:0;background:transparent;font-size:20px;color:var(--muted);width:36px;height:36px}
.pcard h3{font-size:17px;padding-right:30px}
/* tour */
.tour{left:0;right:0;bottom:0;z-index:8;background:var(--surface);color:var(--ink);border-radius:18px 18px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.3);max-height:50%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.tour .bar{height:6px;border-radius:18px 18px 0 0}
.tour .ctl{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.tour .ctl .t{flex:1;min-width:0;font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tour .ctl button{border:1px solid var(--line);background:var(--surface2);border-radius:11px;min-width:44px;height:42px;font-size:16px}
.tour .body{overflow-y:auto;padding:12px 16px 16px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px}
.tour .body h3{font-size:19px}
.touring .mbot{bottom:calc(50% + 8px)}
.touring .mside,.touring .chips.sm,.touring .pcard{display:none}
.touring .mtop{top:calc(8px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
